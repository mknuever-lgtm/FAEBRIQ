<!-- @dsCard group="Colors" viewport="700x180" name="Core neutrals — the void" subtitle="Backgrounds & surfaces, #0d0d0d up the value scale" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--bg-page); }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { border: 1px solid var(--border-hairline); }
  .chip { height: 76px; }
  .meta { padding: 8px 9px; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--text-body); letter-spacing: .02em; }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); margin-top: 3px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#0d0d0d"></div><div class="meta"><div class="name">black</div><div class="hex">#0D0D0D</div></div></div>
    <div class="sw"><div class="chip" style="background:#0a0a0a"></div><div class="meta"><div class="name">ink-900</div><div class="hex">#0A0A0A</div></div></div>
    <div class="sw"><div class="chip" style="background:#141414"></div><div class="meta"><div class="name">ink-800</div><div class="hex">#141414</div></div></div>
    <div class="sw"><div class="chip" style="background:#1c1c1c"></div><div class="meta"><div class="name">ink-700</div><div class="hex">#1C1C1C</div></div></div>
    <div class="sw"><div class="chip" style="background:#262626"></div><div class="meta"><div class="name">ink-600</div><div class="hex">#262626</div></div></div>
    <div class="sw"><div class="chip" style="background:#2a2a2a"></div><div class="meta"><div class="name">line-700</div><div class="hex">#2A2A2A</div></div></div>
  </div>
</body>
</html>
