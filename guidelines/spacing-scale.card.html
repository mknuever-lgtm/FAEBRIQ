<!-- @dsCard group="Spacing" viewport="700x210" name="Spacing scale" subtitle="4px base — generous editorial whitespace" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg-page); }
  .row { display:flex; align-items:center; gap: 12px; margin-bottom: 9px; }
  .bar { height: 14px; background: var(--fae-accent); }
  .lab { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); width: 120px; }
</style>
</head>
<body>
  <div class="row"><span class="lab">space-1 · 4</span><span class="bar" style="width:4px"></span></div>
  <div class="row"><span class="lab">space-2 · 8</span><span class="bar" style="width:8px"></span></div>
  <div class="row"><span class="lab">space-3 · 12</span><span class="bar" style="width:12px"></span></div>
  <div class="row"><span class="lab">space-4 · 16</span><span class="bar" style="width:16px"></span></div>
  <div class="row"><span class="lab">space-5 · 24</span><span class="bar" style="width:24px"></span></div>
  <div class="row"><span class="lab">space-6 · 32</span><span class="bar" style="width:32px"></span></div>
  <div class="row"><span class="lab">space-7 · 48</span><span class="bar" style="width:48px"></span></div>
  <div class="row"><span class="lab">space-8 · 64</span><span class="bar" style="width:64px"></span></div>
  <div class="row"><span class="lab">space-9 · 96</span><span class="bar" style="width:96px"></span></div>
</body>
</html>
