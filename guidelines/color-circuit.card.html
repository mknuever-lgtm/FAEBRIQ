<!-- @dsCard group="Colors" viewport="700x250" name="Rainbow circuit" subtitle="The signature trace — six colors swept across one branching circuit" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px 24px; background: var(--bg-page); }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 20px; }
  .sw { border: 1px solid var(--border-hairline); }
  .chip { height: 40px; }
  .meta { padding: 6px 8px; }
  .name { font-family: var(--font-mono); font-size: 10px; color: var(--text-body); }
  .hex { font-family: var(--font-mono); font-size: 9px; color: var(--text-faint); margin-top: 2px; }
  .trace { width: 100%; display: block; }
  .cap { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); margin-top: 12px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#e05a4e"></div><div class="meta"><div class="name">coral</div><div class="hex">#E05A4E</div></div></div>
    <div class="sw"><div class="chip" style="background:#e08c30"></div><div class="meta"><div class="name">amber</div><div class="hex">#E08C30</div></div></div>
    <div class="sw"><div class="chip" style="background:#c8b830"></div><div class="meta"><div class="name">yellow</div><div class="hex">#C8B830</div></div></div>
    <div class="sw"><div class="chip" style="background:#4caf7a"></div><div class="meta"><div class="name">green</div><div class="hex">#4CAF7A</div></div></div>
    <div class="sw"><div class="chip" style="background:#4a9eff"></div><div class="meta"><div class="name">blue</div><div class="hex">#4A9EFF</div></div></div>
    <div class="sw"><div class="chip" style="background:#9b6fd4"></div><div class="meta"><div class="name">purple</div><div class="hex">#9B6FD4</div></div></div>
  </div>
  <img class="trace" src="../assets/circuit.svg" alt="FÆBRIQ rainbow circuit trace" />
  <div class="cap">// the trace — gradient swept coral → purple, filled pads, hollow nodes. never used as fills.</div>
</body>
</html>
