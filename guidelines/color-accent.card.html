<!-- @dsCard group="Colors" viewport="700x190" name="Accent — terminal blue" subtitle="The single accent: links, focus, calls to action" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--bg-page); display:flex; gap: 22px; align-items:center; }
  .swatch { width: 150px; height: 130px; border: 1px solid var(--border-hairline); display:flex; flex-direction:column; justify-content:flex-end; }
  .swatch .lab { font-family: var(--font-mono); font-size: 10px; padding: 8px 9px; }
  .uses { flex: 1; display:flex; flex-direction:column; gap: 12px; }
  .uses a { font-family: var(--font-body); font-size: 15px; }
  .btn { display:inline-block; align-self:flex-start; background:#4a9eff; color:#0d0d0d; font-family:var(--font-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; padding:9px 16px; }
  .focus { font-family:var(--font-body); font-size:14px; color:#e8e8e8; padding:7px 12px; border:1px solid #2a2a2a; box-shadow:0 0 0 1px #4a9eff, 0 0 12px -2px rgba(74,158,255,.5); align-self:flex-start; }
</style>
</head>
<body>
  <div class="swatch" style="background:#4a9eff"><span class="lab" style="color:#0d0d0d">accent · #4A9EFF</span></div>
  <div class="uses">
    <a href="#">A link in terminal blue →</a>
    <span class="btn">Deploy</span>
    <span class="focus">Focused field</span>
  </div>
</body>
</html>
