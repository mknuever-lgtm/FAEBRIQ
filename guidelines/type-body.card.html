<!-- @dsCard group="Type" viewport="700x250" name="Body — Archivo" subtitle="Neutral grotesque for running text and UI" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px 24px; background: var(--bg-page); }
  .lead { font-family: var(--font-body); font-size: 18px; color: var(--text-body); max-width: 560px; line-height: 1.5; }
  .body { font-family: var(--font-body); font-size: 15px; color: var(--text-muted); max-width: 560px; line-height: 1.6; margin-top: 12px; }
  .weights { display:flex; gap: 20px; margin-top: 18px; align-items:baseline; }
  .w { font-family: var(--font-body); font-size: 18px; color: var(--text-body); }
  .wl { font-family: var(--font-mono); font-size: 9px; color: var(--text-faint); display:block; margin-top:4px; }
</style>
</head>
<body>
  <p class="lead">Engineered for the modern tech-nomad. High-contrast aesthetics, a quiet message.</p>
  <p class="body">Premium heavyweight cotton. Soft. Durable. Designed for those who build, deploy, and live their identity — wherever the work takes them.</p>
  <div class="weights">
    <div><span class="w" style="font-weight:300">Light</span><span class="wl">300</span></div>
    <div><span class="w" style="font-weight:400">Regular</span><span class="wl">400</span></div>
    <div><span class="w" style="font-weight:500">Medium</span><span class="wl">500</span></div>
    <div><span class="w" style="font-weight:600">Semibold</span><span class="wl">600</span></div>
    <div><span class="w" style="font-weight:700">Bold</span><span class="wl">700</span></div>
  </div>
</body>
</html>
