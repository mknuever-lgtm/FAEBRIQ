<!-- @dsCard group="Type" viewport="700x200" name="Mono & overline — JetBrains Mono" subtitle="Terminal labels, kickers, circuit annotations" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px 24px; background: var(--bg-page); }
  .stack { display:flex; flex-direction:column; gap: 16px; }
  .over { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); }
  .term { font-family: var(--font-mono); font-size: 14px; color: var(--text-body); }
  .term .p { color: var(--fae-circuit-green); }
  .term .a { color: var(--fae-accent); }
  .meta { font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="stack">
    <div class="over">New Drop · Collection 02</div>
    <div class="term"><span class="p">$</span> git commit -m <span class="a">"deploying identity v2.0"</span></div>
    <div class="term">SKU&nbsp;&nbsp;FAE-TEE-001&nbsp;&nbsp;·&nbsp;&nbsp;6.5oz&nbsp;&nbsp;·&nbsp;&nbsp;XS–3XL</div>
    <div class="meta">// quietly annotates. never shouts.</div>
  </div>
</body>
</html>
