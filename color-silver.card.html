<!-- @dsCard group="Colors" viewport="700x180" name="Silver — the wordmark" subtitle="Brand silver and its highlight/shadow edges" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--bg-page); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: end; }
  .sw { border: 1px solid var(--border-hairline); }
  .chip { height: 84px; }
  .meta { padding: 9px 10px; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--text-body); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); margin-top: 3px; }
  .mark { font-family: var(--font-display); font-size: 30px; letter-spacing: .06em; margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="mark" style="color:#c0c0c0">FÆBRIQ</div>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#c0c0c0"></div><div class="meta"><div class="name">silver</div><div class="hex">#C0C0C0</div></div></div>
    <div class="sw"><div class="chip" style="background:#d8d8d8"></div><div class="meta"><div class="name">silver-hi</div><div class="hex">#D8D8D8</div></div></div>
    <div class="sw"><div class="chip" style="background:#8a8a8a"></div><div class="meta"><div class="name">silver-lo</div><div class="hex">#8A8A8A</div></div></div>
  </div>
</body>
</html>
