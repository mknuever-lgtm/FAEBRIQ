<!-- @dsCard group="Colors" viewport="700x170" name="Text on dark" subtitle="The four text values — body to ghost" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg-page); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .line { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--border-hairline); padding-bottom: 12px; }
  .sample { font-family: var(--font-body); font-size: 19px; }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="stack">
    <div class="line"><span class="sample" style="color:#e8e8e8">Body text — the default voice</span><span class="tag">--text-body · #E8E8E8</span></div>
    <div class="line"><span class="sample" style="color:#9a9a9a">Muted — secondary information</span><span class="tag">--text-muted · #9A9A9A</span></div>
    <div class="line"><span class="sample" style="color:#5f5f5f">Faint — captions &amp; disabled</span><span class="tag">--text-faint · #5F5F5F</span></div>
    <div class="line" style="border:0"><span class="sample" style="color:#3a3a3a">Ghost — watermark level</span><span class="tag">--text-ghost · #3A3A3A</span></div>
  </div>
</body>
</html>
