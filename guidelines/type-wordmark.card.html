<!-- @dsCard group="Type" viewport="700x230" name="Wordmark" subtitle="Instrument Serif, silver, +0.06em tracking — the brand voice" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 28px 24px; background: var(--bg-page); }
  .mark { font-family: var(--font-display); color: var(--text-display); letter-spacing: .06em; font-size: 76px; line-height: 1; }
  .rule { width: 280px; margin: 14px 0 16px; }
  .tag { font-family: var(--font-display); font-style: italic; color: var(--text-muted); letter-spacing: .04em; font-size: 20px; }
  .note { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); margin-top: 18px; }
</style>
</head>
<body>
  <div class="mark">FÆBRIQ</div>
  <span class="fae-circuit-rule rule"></span>
  <div class="tag">Code it. Serve it.</div>
  <div class="note">font-family: var(--font-display) · letter-spacing: var(--type-wordmark-spacing)</div>
</body>
</html>
