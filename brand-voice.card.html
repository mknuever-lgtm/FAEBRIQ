<!-- @dsCard group="Brand" viewport="700x260" name="Voice & tone" subtitle="Dry, direct, slightly cheeky. Short sentences. Periods as punctuation." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px 24px; background: var(--bg-page); }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 14px 28px; }
  .col h { font-family: var(--font-mono); font-size: 10px; letter-spacing:.12em; text-transform:uppercase; display:block; margin-bottom: 12px; }
  .yes h { color: var(--fae-circuit-green); }
  .no h { color: var(--fae-circuit-coral); }
  .item { font-family: var(--font-body); font-size: 14px; color: var(--text-body); margin-bottom: 9px; line-height:1.4; }
  .no .item { color: var(--text-muted); text-decoration: line-through; text-decoration-color: var(--fae-circuit-coral); }
</style>
</head>
<body>
  <div class="grid">
    <div class="col yes">
      <h>We say</h>
      <div class="item">Code it. Serve it.</div>
      <div class="item">Please hold, I'm rebranding my identity.</div>
      <div class="item">Wear your code. Live your truth.</div>
      <div class="item">Engineered for the tech-nomad.</div>
    </div>
    <div class="col no">
      <h>We never say</h>
      <div class="item">Unleash your inner coder!! 🚀</div>
      <div class="item">Game-changing queer-owned synergy</div>
      <div class="item">You won't BELIEVE this drop</div>
      <div class="item">Best. Tee. Ever.</div>
    </div>
  </div>
</body>
</html>
