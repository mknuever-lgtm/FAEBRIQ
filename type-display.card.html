<!-- @dsCard group="Type" viewport="700x300" name="Display scale — Instrument Serif" subtitle="Editorial headings, silver, set tight" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px 24px; background: var(--bg-page); }
  .stack { display:flex; flex-direction:column; gap: 14px; }
  .item { display:flex; align-items:baseline; gap: 18px; }
  .d { font-family: var(--font-display); color: var(--text-heading); line-height: 1.05; letter-spacing: -.01em; }
  .t { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); white-space:nowrap; }
</style>
</head>
<body>
  <div class="stack">
    <div class="item"><span class="d" style="font-size:64px; color:#c0c0c0">Identity</span><span class="t">4xl · 64</span></div>
    <div class="item"><span class="d" style="font-size:44px">Deploying the self</span><span class="t">3xl · 44</span></div>
    <div class="item"><span class="d" style="font-size:32px">A quiet rebellion in serif</span><span class="t">2xl · 32</span></div>
    <div class="item"><span class="d" style="font-size:24px; font-style:italic">Please hold, I'm rebranding.</span><span class="t">xl · 24 italic</span></div>
  </div>
</body>
</html>
